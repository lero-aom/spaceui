name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing crate's version tag (first publication uses cargo login locally)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify publication uses the manifest's version tag
        if: inputs.publish
        run: python .github/scripts/check_release_tag.py
      - run: cargo package --locked --list
      - run: cargo publish --locked --dry-run
      - name: Verify documentation and examples from the packaged sources
        shell: python
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          from pathlib import Path
          import subprocess
          import tomllib

          package = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]
          manifest = Path("target/package") / f"{package['name']}-{package['version']}" / "Cargo.toml"
          for command in [
              ["doc", "--no-deps"],
              ["check", "--examples"],
              ["test", "--doc"],
          ]:
              subprocess.run(
                  ["cargo", *command, "--locked", "--all-features", "--manifest-path", str(manifest)],
                  check=True,
              )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
