<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- Probe logo: a deep-space probe drifting over a purple moon, orbit swoosh after the Spacemacs mark. -->
  <defs>
    <radialGradient id="planet" cx="372" cy="300" r="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7C9EC"/>
      <stop offset="0.28" stop-color="#A594CC"/>
      <stop offset="0.62" stop-color="#7A66A8"/>
      <stop offset="0.86" stop-color="#5A4B88"/>
      <stop offset="1" stop-color="#463A72"/>
    </radialGradient>
    <radialGradient id="rim" cx="617" cy="645" r="556" gradientUnits="userSpaceOnUse">
      <stop offset="0.82" stop-color="#2A1F4A" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A1F4A" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="617" cy="645" r="556"/>
    </clipPath>

    <!-- long shadows fall down-right, light comes from the upper left -->
    <linearGradient id="shPanelL" gradientUnits="userSpaceOnUse" x1="330" y1="500" x2="600" y2="1150">
      <stop offset="0" stop-color="#36275C" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#36275C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shBody" gradientUnits="userSpaceOnUse" x1="600" y1="640" x2="860" y2="1260">
      <stop offset="0" stop-color="#36275C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#36275C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shDish" gradientUnits="userSpaceOnUse" x1="760" y1="520" x2="1040" y2="1180">
      <stop offset="0" stop-color="#36275C" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#36275C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shPanelR" gradientUnits="userSpaceOnUse" x1="840" y1="850" x2="1060" y2="1300">
      <stop offset="0" stop-color="#36275C" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#36275C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shBall" gradientUnits="userSpaceOnUse" x1="978" y1="310" x2="1230" y2="900">
      <stop offset="0" stop-color="#36275C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#36275C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="swoosh" gradientUnits="userSpaceOnUse" x1="120" y1="120" x2="810" y2="420">
      <stop offset="0" stop-color="#F1EFEE"/>
      <stop offset="0.42" stop-color="#F3F1F5" stop-opacity="0.97"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE5F5"/>
    </linearGradient>
    <linearGradient id="faceLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8FE"/>
      <stop offset="1" stop-color="#E2D6EE"/>
    </linearGradient>
    <linearGradient id="faceMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DACCE9"/>
      <stop offset="1" stop-color="#BBA6D4"/>
    </linearGradient>
    <linearGradient id="faceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6B2DC"/>
      <stop offset="1" stop-color="#A48DC4"/>
    </linearGradient>
    <linearGradient id="dishInner" gradientUnits="userSpaceOnUse" x1="900" y1="380" x2="640" y2="600">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F6F1FB"/>
      <stop offset="1" stop-color="#D9CBEA"/>
    </linearGradient>
    <linearGradient id="dishBowl" gradientUnits="userSpaceOnUse" x1="560" y1="420" x2="900" y2="720">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EEE6F6"/>
      <stop offset="1" stop-color="#CDBCE2"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EEE7F6"/>
      <stop offset="1" stop-color="#C2AEDA"/>
    </radialGradient>
  </defs>

  <!-- planet -->
  <circle cx="617" cy="645" r="556" fill="url(#planet)"/>

  <g clip-path="url(#disc)">
    <!-- craters -->
    <g fill="#FFFFFF" fill-opacity="0.07" stroke="#3E3068" stroke-opacity="0.12" stroke-width="6">
      <ellipse cx="222" cy="905" rx="58" ry="40" transform="rotate(32 222 905)"/>
      <ellipse cx="366" cy="1030" rx="38" ry="26" transform="rotate(18 366 1030)"/>
      <ellipse cx="477" cy="1106" rx="22" ry="14"/>
      <ellipse cx="640" cy="1042" rx="52" ry="40"/>
      <ellipse cx="898" cy="1036" rx="32" ry="22" transform="rotate(-10 898 1036)"/>
    </g>

    <!-- long shadows cast by the probe -->
    <polygon fill="url(#shPanelL)" points="162,403 250,522 505,612 863,1462 520,1253"/>
    <polygon fill="url(#shBody)" points="480,650 588,712 706,672 716,548 1066,1378 830,1512"/>
    <polygon fill="url(#shDish)" points="560,500 700,632 984,665 1336,1503 912,1338"/>
    <polygon fill="url(#shPanelR)" points="690,742 740,828 990,968 1271,1638 971,1412"/>
    <polygon fill="url(#shBall)" points="945,324 1011,296 1282,941 1216,969"/>

    <!-- terminator shading on the far rim -->
    <circle cx="617" cy="645" r="556" fill="url(#rim)"/>
  </g>

  <!-- orbit swoosh -->
  <path fill="url(#swoosh)" d="M150,348
    C96,282 80,180 118,112
    C162,34 262,18 362,44
    C522,88 702,220 806,416
    C690,256 522,138 372,100
    C266,74 186,92 150,140
    C118,184 120,268 150,348 Z"/>

  <!-- probe -->
  <g stroke-linejoin="round">
    <!-- left solar panel -->
    <polygon fill="url(#faceDark)" points="162,403 250,522 256,540 168,421"/>
    <polygon fill="url(#faceMid)" points="250,522 505,612 509,630 256,540"/>
    <polygon fill="url(#faceTop)" points="162,403 412,481 505,612 250,522"/>
    <!-- strut to the body -->
    <polygon fill="url(#faceMid)" points="486,596 520,616 512,632 478,612"/>

    <!-- nozzle -->
    <g transform="rotate(36 522 732)">
      <rect x="484" y="706" width="64" height="52" rx="6" fill="url(#faceMid)"/>
      <rect x="484" y="706" width="64" height="20" rx="6" fill="url(#faceLit)"/>
      <ellipse cx="486" cy="732" rx="10" ry="26" fill="#F7F2FC"/>
    </g>

    <!-- body: a squat hexagonal bus -->
    <polygon fill="url(#faceLit)" points="484,644 574,550 612,560 606,690 520,700"/>
    <polygon fill="url(#faceDark)" points="606,690 612,560 724,652 650,776"/>
    <polygon fill="url(#faceMid)" points="520,700 606,690 650,776 562,780"/>
    <polygon fill="url(#faceTop)" points="574,550 612,560 640,548 600,540"/>

    <!-- right solar panel -->
    <polygon fill="url(#faceMid)" points="690,742 740,828 744,846 694,760"/>
    <polygon fill="url(#faceDark)" points="740,828 990,968 992,984 744,846"/>
    <polygon fill="url(#faceTop)" points="690,742 884,796 990,968 740,828"/>
    <polygon fill="url(#faceMid)" points="660,726 700,746 694,762 654,742"/>

    <!-- dish mount -->
    <polygon fill="url(#faceMid)" points="616,566 662,586 676,618 630,600"/>

    <!-- dish: outer bowl, then the concave inner face -->
    <path fill="url(#dishBowl)" d="M556,319 C470,560 760,760 984,665 C900,640 640,470 556,319 Z"/>
    <ellipse cx="770" cy="492" rx="275" ry="104" transform="rotate(39 770 492)" fill="url(#dishInner)"/>
    <path fill="none" stroke="#D3C3E6" stroke-width="5" d="M556,319 C640,470 900,640 984,665"/>

    <!-- feed antenna -->
    <polygon fill="#F6F1FB" points="806,574 818,578 978,320 966,314"/>
    <polygon fill="#D7C8E8" points="818,578 826,571 984,324 978,320"/>
    <polygon fill="#F2ECF9" points="778,434 788,442 970,318 962,310"/>
    <circle cx="978" cy="310" r="36" fill="url(#ball)"/>
  </g>
</svg>
