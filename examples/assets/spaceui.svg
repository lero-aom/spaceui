<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SpaceUI: a planet with a copper-to-violet orbit and a sparkle, at home on either theme. -->
  <defs>
    <radialGradient id="planet" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#F7F4FF"/>
      <stop offset="0.42" stop-color="#C3BCE0"/>
      <stop offset="0.8" stop-color="#6E6797"/>
      <stop offset="1" stop-color="#4A4470"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB070"/>
      <stop offset="0.5" stop-color="#E9844A"/>
      <stop offset="1" stop-color="#9B8BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the far half of the orbit passes behind the planet -->
  <g transform="translate(128 140) rotate(-18)">
    <path d="M -110 0 A 110 34 0 0 1 110 0" fill="none" stroke="url(#orbit)" stroke-width="11" stroke-linecap="round" opacity="0.75"/>
  </g>
  <circle cx="122" cy="140" r="68" fill="url(#planet)"/>
  <path d="M 84 102 A 52 52 0 0 1 150 86" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(128 140) rotate(-18)">
    <path d="M 110 0 A 110 34 0 0 1 -110 0" fill="none" stroke="url(#orbit)" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- sparkle -->
  <circle cx="204" cy="58" r="26" fill="url(#glow)" opacity="0.5"/>
  <path d="M204 34 C206 50 212 56 228 58 C212 60 206 66 204 82 C202 66 196 60 180 58 C196 56 202 50 204 34 Z" fill="#FFFFFF"/>
  <circle cx="52" cy="62" r="5" fill="#FFD2A8"/>
</svg>
