[package]
name = "spaceui"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "A design system for egui desktop apps: themes, anti-aliased painting, vector icons, widgets, a custom-window shell and a chat kit"
license = "Apache-2.0"
repository = "https://github.com/lero-aom/spaceui"
documentation = "https://docs.rs/spaceui"
readme = "README.md"
keywords = ["egui", "gui", "design-system", "theme", "widgets"]
categories = ["gui"]
# Screenshots and CI stay in the repository; the package carries the code, icons and gallery.
exclude = ["/docs", "/.github", "/target", "/fuzz"]

[features]
default = ["svg", "shell", "chat", "native", "screenshot"]
# Themes, painting and basic widgets work without any optional dependencies.
svg = ["dep:resvg"]
shell = ["svg"]
chat = ["svg", "dep:egui_commonmark", "dep:pulldown-cmark"]
native = ["dep:raw-window-handle"]
screenshot = ["svg"]

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
# Logos and icons stay SVG and are rasterized at the display's pixel density.
resvg = { version = "0.49", default-features = false, optional = true }
# Native window chrome (rounded corners on Windows 11).
raw-window-handle = { version = "0.6", optional = true }

[dev-dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
stats_alloc = "0.1.10"

[[example]]
name = "minimal"
required-features = ["shell", "native"]

[[example]]
name = "custom_theme"
required-features = ["shell", "native"]

[[example]]
name = "gallery"
required-features = ["shell", "chat", "native", "screenshot"]

[[bench]]
name = "workloads"
harness = false
required-features = ["chat"]

[[bench]]
name = "allocations"
harness = false
required-features = ["chat"]

[[bench]]
name = "svg_resize"
harness = false
required-features = ["svg"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Pixel maths converts between f32, u32 and usize on purpose.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# `spaceui::theme::Theme` reads better than renamed types.
module_name_repetitions = "allow"
